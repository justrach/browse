# A version tag (v1.0.2, made by ./release.sh) becomes a release: built,
# signed with the Developer ID, notarised by Apple, stapled, and published
# as a GitHub release with the DMG, the ZIP and appcast.json — which every
# installed copy reads (Updater.swift), so this is also how updates go out.
#
# Needs these repository secrets (docs/releasing.md says how to make them):
#   MACOS_CERTIFICATE           the Developer ID Application certificate, .p12, base64
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_ID                    the Apple Account that notarises
#   APPLE_APP_PASSWORD          an app-specific password for it
#   APPLE_TEAM_ID               the team, e.g. WWP9DLJ27P
# And, for passkeys (optional; without it the app is signed without them):
#   MACOS_PROVISION_PROFILE     the Developer ID provisioning profile, base64
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build again, e.g. v1.0.2"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"

      - name: The tag is the version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ "v$VERSION" = "$TAG" ] || { echo "VERSION says $VERSION but the tag is $TAG" >&2; exit 1; }

      - name: A keychain of the run's own, with the certificate in it
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$CERTIFICATE" ] || { echo "MACOS_CERTIFICATE isn't set — see docs/releasing.md" >&2; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          xcrun notarytool store-credentials release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          echo "SEARCH_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SEARCH_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')" >> "$GITHUB_ENV"

      - name: The passkey profile, when there is one
        env:
          PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
        run: |
          if [ -n "$PROFILE" ]; then
            echo "$PROFILE" | base64 --decode > browse.provisionprofile
          else
            echo "no MACOS_PROVISION_PROFILE — this release goes out without passkeys"
          fi

      - name: Build, sign, notarise
        env:
          SEARCH_NOTARY_PROFILE: release
        run: ./build.sh release ship

      - name: Checked the way a Mac that downloads it will check it
        run: |
          spctl --assess --type open --context context:primary-signature -v build/browse.dmg
          xcrun stapler validate build/browse.dmg
          codesign --verify --deep --strict build/browse.app

      - name: Published — installed copies pick it up from here
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publish.sh github

      - name: The run's keychain goes
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
