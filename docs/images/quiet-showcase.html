<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>browse — just the page</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background: #bac7de url("quiet-wallpaper-v1.png") center / cover no-repeat;
  }
  img {
    display: block;
    width: 80%;
    height: auto;
    max-height: 84%;
    object-fit: contain;
    border-radius: 12px;
    filter: drop-shadow(0 24px 34px rgb(28 38 61 / 28%));
  }
</style>
<img src="../screenshots/quiet-window.png" alt="browse with its tab bar hidden, showing a Wikipedia article">
</html>
